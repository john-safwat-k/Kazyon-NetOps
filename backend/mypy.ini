# Mypy configuration for the IT Network Support AI Agent backend.
# See CLAUDE.md §18.

[mypy]
explicit_package_bases = True
mypy_path = .
python_version = 3.12

[mypy-openpyxl.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-bcrypt.*]
ignore_missing_imports = True
